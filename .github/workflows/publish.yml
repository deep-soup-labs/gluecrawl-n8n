name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required for npm provenance: the OIDC token is what lets npm attest that
  # this tarball was built by this workflow from this commit. Verified n8n
  # community nodes must be published with a provenance statement, so a local
  # `npm publish` is never an acceptable substitute for this job.
  id-token: write

jobs:
  publish:
    name: Build, test and publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
